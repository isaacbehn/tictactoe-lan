name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Resolver ruta de HOME
        run: echo "KEYSTORE_PATH=$HOME/.android/debug.keystore" >> $GITHUB_ENV

      - name: Instalar plantillas de exportación
        run: |
          mkdir -v -p $HOME/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable $HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Generar keystore de depuración
        run: |
          mkdir -p $HOME/.android
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Preparar carpeta de salida
        run: mkdir -p build

      - name: Importar proyecto
        run: godot --headless --import --path .

      - name: Exportar APK (debug)
        run: godot --headless --export-debug "Android" build/tictactoe-lan.apk --path .
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ env.KEYSTORE_PATH }}
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tictactoe-lan-apk
          path: build/tictactoe-lan.apk
